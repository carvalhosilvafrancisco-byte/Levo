// Build script raiz do projeto "Levo Maquininha" (wrapper Android + PlugPag)
buildscript {
    ext.kotlin_version = "1.9.22"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.2.2"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // Repositório oficial do SDK PlugPag (PagBank) — necessário para baixar a lib.
        maven { url 'https://github.com/pagseguro/PlugPagServiceWrapper/raw/master' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
