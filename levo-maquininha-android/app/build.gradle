plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.levoconveniencia.maquininha'
    compileSdk 34

    defaultConfig {
        applicationId "com.levoconveniencia.maquininha"
        // O PlugPag exige minSdk 21+ nas versões mais recentes do wrapper;
        // confira a versão exigida na documentação do SDK que você receber do PagBank.
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'

    // SDK PlugPag (PagBank) — biblioteca para conectar com o terminal físico.
    // Versão confirmada na documentação oficial (pagseguro.github.io/pagseguro-sdk-plugpagservicewrapper).
    // Se o PagBank divulgar uma versão mais nova, troque o número abaixo.
    implementation 'br.com.uol.pagseguro.plugpagservice.wrapper:wrapper:1.30.51'
}
