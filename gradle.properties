# Necessário porque o projeto usa bibliotecas AndroidX (androidx.core, androidx.appcompat)
android.useAndroidX=true
android.enableJetifier=true

# Acelera builds e evita erros de memória em compilações na nuvem (GitHub Actions)
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
